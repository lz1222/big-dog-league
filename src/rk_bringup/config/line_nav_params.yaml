real_line_tracker_node:
  ros__parameters:
    # 图像输入/输出话题。正常只需要改 image_topic，除非你的相机话题名变了。
    image_topic: /camera/color/image_raw
    line_track_topic: /perception/line_track
    red_circle_topic: /perception/red_circle_detection
    stop_zone_topic: /perception/stop_zone_detection
    white_bar_topic: /perception/white_bar_detection
    corner_candidate_topic: /perception/corner_candidate

    # 调试开关。比赛/真实巡线建议 false，能减轻相机和 CPU 压力。
    # 需要看 /perception/debug/line_overlay 时再临时改成 true。
    enable_debug_image: false
    debug_log: true

    # ROI 检测区域。相机只看地面时通常保持全画面 ROI。
    # 如果画面上方经常出现无关黑物体，可以适当增大 roi_top_fraction。
    # 如果机器狗脚或机身遮挡底部，可以适当增大 roi_bottom_margin_fraction。
    use_full_frame_roi: true
    roi_top_fraction: 0.05
    roi_bottom_margin_fraction: 0.03
    roi_left_margin_fraction: 0.03
    roi_right_margin_fraction: 0.03

    # 黑线二值化阈值。值越大，越容易把灰色/阴影也当成黑线。
    # 误识别黑色物体时可以适当降低；黑线识别不到时可以适当提高。
    threshold_value: 70

    # 输出误差限制。一般不需要改。
    max_lateral_error: 1.0

    # 机器狗实际中心线校准。
    # 紫色线=相机画面几何中心；橙色粗线=机器狗控制中心。
    # 如果机器狗实际中心在紫色线右侧，robot_center_x_offset_fraction 设为正数；
    # 如果在左侧，设为负数。每 0.01 约等于画面宽度的 1%。
    # 需要更精细时再用 robot_center_x_offset_px 微调像素。
    robot_center_x_offset_fraction: 0.0
    robot_center_x_offset_px: 0.0

    line_width_cm: 10.0

    # 扫描带数量和最少有效带数量。
    # min_path_bands 越大，越不容易误识别零散黑块，但线短/画面卡顿时更容易丢线。
    num_scan_bands: 11
    min_path_bands: 4
    min_valid_bands: 4

    # 要求最靠近机器狗的底部扫描带必须看到线。
    # 这是防止隔壁黑色物体抢线的关键开关，正常巡地面黑线建议保持 true。
    require_bottom_band: true

    # 基础线宽范围，按图像宽度比例计算。
    # 如果黑线太粗被判 too_wide，提高 max_line_width_fraction。
    # 如果黑线太细被判 too_narrow，降低 min_line_width_fraction。
    min_line_width_fraction: 0.015
    max_line_width_fraction: 0.26

    # 透视线宽范围。靠近机器狗的线在画面底部更宽，远处更窄。
    # 如果底部黑线因为畸变/靠近相机显得很粗，提高 max_line_width_bottom_fraction。
    # 如果远处线太细识别不到，降低 min_line_width_top_fraction。
    perspective_width_enabled: true
    min_line_width_top_fraction: 0.006
    min_line_width_bottom_fraction: 0.018
    max_line_width_top_fraction: 0.12
    max_line_width_bottom_fraction: 0.42

    # 画面中黑色像素占比过大时判为异常，避免整块黑物体/阴影被当线。
    # 环境很暗且经常 too_dark 时可以略微提高；误识别黑物体时降低。
    max_dark_fraction: 0.22

    # 可见置信度阈值。越高越保守，越低越容易跟错线。
    # 4/11 个扫描带命中时置信度约 0.36；起步阶段允许 0.35，
    # 再配合 require_bottom_band 和 track_lock 保持在中间线附近。
    visible_min_confidence: 0.35

    # 路径锁定。开启后优先跟随上一帧附近的线，避免突然跳到隔壁黑物体。
    track_lock_enabled: true

    # 允许当前线位置相对上一帧跳变的最大比例。
    # 旁边黑物体抢线时降低；急弯/大偏移时识别过保守再提高。
    max_track_jump_fraction: 0.18
    max_reacquire_jump_fraction: 0.12

    # 选线权重。数值越大，越偏向底部线和上一帧位置。
    # 隔壁黑物体干扰时提高；真实弯道切换不够灵活时降低。
    bottom_band_preference_weight: 8.0
    previous_center_weight: 10.0

    # 底部起点必须离图像中心/上一帧锁定线足够近。
    # 这是防止远处或侧边黑物体被当作起点的关键参数。
    # 误识别时降到 0.18；正常急弯丢线时升到 0.30。
    bottom_start_max_center_error_fraction: 0.30

    # 相邻扫描带之间允许的中心跳变。越小越要求线连续。
    # 黑物体干扰时降低；弯道识别断续时提高。
    max_band_center_jump_fraction: 0.16
    max_band_gap: 2

    # 特殊目标仅输出视觉证据，停车、转向和动作均由 mission 决定。
    red_circle_min_area_ratio: 0.002
    red_circle_min_circularity: 0.55

    # 蓝色启停区 HSV 与进入判定参考点。
    blue_h_min: 90
    blue_h_max: 130
    blue_s_min: 60
    blue_v_min: 40
    stop_zone_min_area_ratio: 0.05
    stop_zone_reference_y_ratio: 0.85

    # 白色横线：高亮、低饱和、横向长条。
    white_bar_v_min: 180
    white_bar_s_max: 80
    white_bar_min_width_ratio: 0.20
    white_bar_max_height_ratio: 0.15
    white_bar_min_area_ratio: 0.002

    # 危险弯角只发布候选和方向提示，不在视觉节点控制机器狗。
    corner_min_heading_error: 0.30
    corner_edge_fraction: 0.28

    frame_id: d435i_color_optical_frame

line_follower_node:
  ros__parameters:
    # ROS 话题名。除非你改了系统接口，否则不要改。
    line_track_topic: /perception/line_track
    suggested_cmd_topic: /navigation/line_follow_cmd_suggested
    line_follow_status_topic: /navigation/line_follow_status
    mission_start_topic: /mission/start
    mission_stop_topic: /mission/stop
    gait_control_lock_topic: /gait/control_lock

    # 控制频率和日志。debug_log=true 会每秒打印一次导航状态，调试时建议保留。
    control_rate_hz: 10.0
    debug_log: true

    # 低速居中巡线参数。现在优先稳和直，不追求速度。
    # 这台 Go2 低于 0.27m/s 容易原地踏步，所以三个速度都先压在 0.27。
    min_driving_speed: 0.27
    base_speed: 0.27
    mid_speed: 0.27
    slow_speed: 0.27

    # 偏差阈值。偏差越大，速度越慢。
    # 走得太冲可以降低 base_speed 或减小阈值；走得太慢可以提高 base_speed。
    error_slow_threshold: 0.12
    error_slowest_threshold: 0.28

    # 转向增益。kp_lateral 管左右偏差，kp_heading 管线方向。
    # 当前先优先走直线：转向增益要钝一点，否则会右一步左一步。
    # 如果还是左右摆：继续降低 kp_lateral 或 max_angular_z。
    # 如果回中太慢：小幅提高 kp_lateral，每次加 0.1。
    kp_lateral: 0.85
    kp_heading: 0.35
    max_angular_z: 0.28
    angular_deadband: 0.08
    angular_smoothing_alpha: 0.22
    line_follow_min_confidence: 0.0

    # 短暂丢线阶段。先停下，按最后转向方向原地找线。
    short_lost_timeout: 0.75
    short_lost_linear_speed: 0.0
    search_angular_speed: 0.25

    # 丢线后按最后方向转向找线。不要把角速度调太大，机器狗会摆。
    turn_90_duration: 0.8
    turn_90_angular_speed: 0.35
    turn_direction_mode: last_error
    default_turn_direction: 1
    turn_direction_deadband: 0.02

    # 转弯过程中丢线后的保持动作。线速度为 0，避免继续向前冲出线外。
    turn_lost_keep_time: 2.0
    lost_turn_linear_speed: 0.0
    lost_turn_angular_speed: 0.25
    turn_lost_min_angular_z: 0.08

    # 长时间找线阶段。原地左右交替扫线，找到稳定线后恢复巡线。
    search_linear_speed: 0.0
    search_line_angular_speed: 0.22
    search_sweep_period: 1.0
    search_timeout: 8.0

    # 重新识别确认帧数。值越小恢复越快，值越大越不容易被瞬时误识别骗回巡线。
    line_reacquire_count: 3
    reacquire_confirm_frames: 3
    reacquire_min_confidence: 0.65
    reacquire_max_lateral_error: 0.75

    # 线检测消息超时。相机/识别卡顿时可以提高到 1.5，但无图像时盲走风险也会增加。
    line_msg_timeout: 1.0
    continuous_search_enabled: true

line_course_mission_node:
  ros__parameters:
    # Mission 只发布候选命令；command_mux 是最终速度唯一发布者。
    cmd_vel_topic: /control/mission_cmd
    suggested_cmd_topic: /navigation/line_follow_cmd_suggested
    mission_state_topic: /mission/line_course_state
    line_track_topic: /perception/line_track
    red_circle_topic: /perception/red_circle_detection
    stop_zone_topic: /perception/stop_zone_detection
    white_bar_topic: /perception/white_bar_detection
    corner_candidate_topic: /perception/corner_candidate
    mission_start_topic: /mission/start
    mission_stop_topic: /mission/stop
    white_bar_action_request_topic: /mission/white_bar_action_request
    white_bar_action_done_topic: /mission/white_bar_action_done
    white_bar_stage_command_topic: /mission/white_bar_stage_command
    white_bar_stage_status_topic: /mission/white_bar_stage_status

    control_rate_hz: 10.0
    suggested_cmd_timeout_sec: 0.5
    detection_timeout_sec: 0.8

    # 危险直角弯提前转向。
    enable_corner_pre_turn: true
    corner_turn_direction: left
    corner_confirm_frames: 3
    corner_min_confidence: 0.45
    corner_vx: 0.03
    corner_angular_z: 0.32
    corner_min_time_sec: 0.8
    corner_max_time_sec: 2.5
    corner_exit_confidence: 0.30
    corner_exit_stable_frames: 3
    corner_cooldown_sec: 3.0

    # 红圈靠近、已有 SDK 动作和动作后的左转。
    red_circle_confirm_frames: 3
    red_circle_min_confidence: 0.55
    red_circle_approach_speed: 0.04
    red_circle_stop_area_ratio: 0.020
    red_circle_stop_y_ratio: 0.65
    red_circle_approach_timeout_sec: 8.0
    red_circle_sdk_action: stretch
    red_circle_sdk_wait_sec: 3.0
    red_circle_action_timeout_sec: 8.0
    sdk_network_interface: eth0
    sdk_action_executable: /home/unitree/rk_inspection_ws/install/rk_go2_sdk_bridge/lib/rk_go2_sdk_bridge/go2_sdk_motion_action
    turn_after_red_direction: left
    turn_after_red_angle_deg: 90.0
    turn_after_red_angular_z: 0.35
    turn_after_red_timeout_sec: 5.0

    # Deprecated: no automatic fallback. 具体阶段必须通过显式 stage command 激活。
    white_bar_confirm_frames: 3
    white_bar_min_confidence: 0.55
    white_bar_approach_speed: 0.03
    white_bar_stop_y_ratio: 0.70
    white_bar_action_timeout_sec: 5.0
    white_bar_motion_name: ''
    allow_finish_only_test: false

    # 蓝区先靠近，机器人参考点连续进入后最终停车。
    stop_zone_confirm_frames: 3
    stop_zone_min_confidence: 0.55
    stop_zone_approach_speed: 0.04
    stop_zone_inside_confirm_frames: 3
    stop_zone_approach_timeout_sec: 10.0

    reacquire_timeout_sec: 8.0
    reacquire_min_confidence: 0.30
    reacquire_stable_frames: 3

white_bar_action_executor:
  ros__parameters:
    request_topic: /mission/white_bar_action_request
    done_topic: /mission/white_bar_action_done
    status_topic: /mission/white_bar_action_status
    mission_stop_topic: /mission/stop
    action_name: /locomotion/execute_motion
    server_wait_timeout_sec: 2.0
    action_timeout_sec: 5.0
