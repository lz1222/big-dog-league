real_line_tracker_node:
  ros__parameters:
    image_topic: /camera/color/image_raw
    line_track_topic: /perception/line_track
    enable_debug_image: true
    debug_log: true
    use_full_frame_roi: true
    roi_top_fraction: 0.05
    roi_bottom_margin_fraction: 0.03
    roi_left_margin_fraction: 0.03
    roi_right_margin_fraction: 0.03
    threshold_value: 80
    max_lateral_error: 1.0
    line_width_cm: 10.0
    num_scan_bands: 11
    min_path_bands: 3
    min_valid_bands: 3
    require_bottom_band: false
    min_line_width_fraction: 0.015
    max_line_width_fraction: 0.20
    max_dark_fraction: 0.35
    visible_min_confidence: 0.45
    max_reacquire_jump_fraction: 0.20
    frame_id: d435i_color_optical_frame
