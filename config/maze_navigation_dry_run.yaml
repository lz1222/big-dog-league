maze_navigation_dry_run:
  ros__parameters:
    # B2 只消费 B1 JSON，并将诊断策略发布为另一个 JSON String。
    perception_status_topic: /maze/perception/dry_run_status
    navigation_status_topic: /maze/navigation/dry_run_status
    input_stale_timeout_sec: 0.80
    evaluation_rate: 20.0
    # 人工操控终端 D 需要及时看到转角和暂停确认状态。
    print_rate: 10.0

    # 固定拓扑只约束大方向，实际转角和居中仍由雷达与 Odom 闭环。
    route_directions: [LEFT, LEFT, RIGHT, RIGHT, LEFT]

    # 外轮廓为 1.80m × 1.40m；下列 corridor_width_m 是最窄通道净宽，
    # 不能误填为迷宫整体纵深。默认假设 base_link 位于机身几何中心。
    robot_length_m: 0.70
    robot_width_m: 0.31
    robot_height_m: 0.40
    wall_height_m: 0.45
    corridor_width_m: 0.57
    footprint_safety_margin_m: 0.03

    # B1 有效量程和新鲜度上限。
    front_max_range_m: 3.00
    side_max_range_m: 2.00
    max_cloud_age_sec: 0.50
    max_odom_age_sec: 0.20

    # 每项状态转换所需连续 B1 帧数。
    sensor_confirm_frames: 3
    # 单帧侧距缺失先输出零诊断速度，第2帧仍缺失才锁定故障。
    side_missing_confirm_frames: 2
    # 单帧侧向余量不足也先停住，第2帧仍不足才锁止；0.185m门限不变。
    side_unsafe_confirm_frames: 2
    corner_confirm_frames: 3
    # 前距和矩形扫掠包络必须连续满足后，才能锁存TURN_LEFT/RIGHT。
    turn_start_confirm_frames: 3
    turn_confirm_frames: 3
    reacquire_confirm_frames: 5
    recovery_confirm_frames: 3
    exit_confirm_frames: 5

    # 这些速度只写入 JSON 诊断，不发布 Twist，也不会控制 Go2。
    corridor_vx: 0.20
    approach_vx: 0.08
    turn_forward_vx: 0.08
    fine_align_vx: 0.04
    reacquire_vx: 0.08
    reverse_vx: 0.05
    max_center_wz: 0.25
    max_turn_wz: 0.55
    min_turn_wz: 0.16
    max_fine_wz: 0.22

    # Round10入口人工四角居中时，1500帧B1侧距中位数为左0.252m、右0.246m；
    # 使用约0.25m作为本机有效墙面回波目标，不直接套用几何半宽0.285m。
    center_kp: 1.20
    turn_kp: 1.10
    fine_turn_kp: 0.90
    side_target_m: 0.25
    center_tolerance_m: 0.07

    # 前方接近、开始移动转向、紧急余量和出口开放判断。
    front_slow_distance_m: 1.00
    # Round10在front约0.92m时左侧开口已污染近墙回波；提前到0.98m切换
    # 对侧墙参考，仍需持续帧确认后才正式进入CORNER_APPROACH。
    corner_approach_distance_m: 0.98
    turn_start_distance_m: 0.62
    front_emergency_distance_m: 0.43
    recovery_front_clear_m: 0.72
    turn_open_distance_m: 0.50
    exit_front_clear_m: 1.00
    exit_side_open_m: 0.50

    # 连续 turn_rad 用于跨正负 pi 的 90 度闭环，不使用固定时间猜角。
    turn_angle_deg: 90.0
    fine_align_enter_deg: 12.0
    fine_align_exit_deg: 18.0
    turn_tolerance_deg: 4.0
    reacquire_yaw_tolerance_deg: 7.0

    # 接近阶段包含尺量和日志核对，可长时间等待且不会发送运动命令。
    # 转向与重捕获依赖Yaw，限制为120秒，避免静止漂移长期累积。
    corner_timeout_sec: 1800.0
    turn_timeout_sec: 120.0
    reacquire_timeout_sec: 120.0
    reverse_timeout_sec: 1.0

maze_navigation_simulator:
  ros__parameters:
    # 模拟器发布 B1 格式 JSON，不发布点云、Odom 或运动命令。
    perception_status_topic: /maze/perception/dry_run_status
    sim_publish_rate: 15.0
    sim_scenario: nominal
    sim_warmup_sec: 0.6
    sim_corridor_sec: 1.2
    sim_approach_sec: 1.0
    sim_turn_sec: 2.0
    sim_reacquire_sec: 1.2
    sim_fault_after_sec: 2.0

maze_operator_monitor:
  ros__parameters:
    # 终端 D 只订阅 B2 JSON，并显示中文人工操作提示。
    navigation_status_topic: /maze/navigation/dry_run_status
    refresh_rate: 5.0
    status_stale_timeout_sec: 1.50
    # 默认步态点动实测约8至18cm；按上界提示，避免低估前方余量消耗。
    manual_step_distance_cm: 18.0
    use_color: true
    beep_on_action_change: true
