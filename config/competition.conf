# Starter parameters for the Go2 multimodal inspection runner.
# Units: seconds for *_s, meters/second for *_mps, radians/second for max_yaw_rate.

control_period_ms=50

cruise_speed_mps=0.28
slow_speed_mps=0.16
turn_gain=0.85
max_yaw_rate=0.55

standup_settle_s=1.0
start_jump_settle_s=1.5
follow_to_avoidance_s=4.0
avoidance_s=5.0
stairs_s=4.5
approach_pickup_s=3.0
arm_action_settle_s=1.5
marker_detect_s=1.0
follow_to_transfer_s=3.5
follow_to_inspection_s=3.5
warning_action_s=1.5
follow_to_placement_s=4.0
follow_to_finish_s=4.0
finish_jump_settle_s=1.5
park_s=1.5

min_marker_confidence=0.55
simulate_line_loss_every=0

# Match draw defaults for simulation. Change these after on-site draw.
default_start_material=box
default_field_material=cylinder
default_placement_zone=zone1
default_warning_sign=wave

