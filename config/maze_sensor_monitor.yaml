pointcloud_sector_monitor:
  ros__parameters:
    cloud_topic: /utlidar/cloud_base

    # base_link coordinates: x forward, y left, z up.
    z_min: -0.15
    z_max: 0.50

    # Remove returns inside the approximate Go2 body footprint.
    body_x_min: -0.45
    body_x_max: 0.45
    body_y_min: -0.25
    body_y_max: 0.25

    # Angular width of each sector in degrees. At 45 degrees, sector centers
    # are front=0, left_front=45, right_front=-45, left=90, right=-90.
    front_angle: 45.0
    min_range: 0.05
    front_max_range: 3.00
    side_max_range: 2.00

    # Must be greater than zero so distance never becomes a single minimum.
    distance_percentile: 10.0
    stale_timeout: 0.50
    print_rate: 2.0

odom_yaw_monitor:
  ros__parameters:
    odom_topic: /utlidar/robot_odom
    stale_timeout: 0.20
    print_rate: 2.0

    # A drift segment starts only while both measured speeds are below these
    # thresholds. Tune from stationary odometry noise before recording drift.
    stationary_linear_speed_threshold: 0.02
    stationary_angular_speed_threshold: 0.02
    stationary_min_duration: 2.0
